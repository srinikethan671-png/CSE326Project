
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Department Notice Board</title>
    <!-- Tailwind CSS CDN for Modern UI Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-bullhorn text-2xl"></i>
                <h1 class="text-2xl font-bold">Virtual Department Notice Board</h1>
            </div>
            <div>
                <button onclick="openModal()" class="bg-white text-indigo-700 font-semibold px-4 py-2 rounded-lg shadow hover:bg-indigo-50 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Create Notice
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-1/3">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Search notices by title, content, author..." 
                    class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex flex-wrap gap-3 w-full md:w-auto">
                <select id="categoryFilter" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="All">All Categories</option>
                    <option value="Exam">Exam / Test</option>
                    <option value="Assignment">Assignment</option>
                    <option value="General">General Announcement</option>
                    <option value="Event">Department Event</option>
                </select>
                <select id="priorityFilter" class="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="All">All Priorities</option>
                    <option value="High">High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>
            </div>
        </div>

        <!-- Pinned Notices Section -->
        <section class="mb-8">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-indigo-900">
                <i class="fa-solid fa-thumbtack text-amber-500"></i> Pinned Notices
            </h2>
            <div id="pinnedContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamically injected pinned cards -->
            </div>
        </section>

        <!-- General Notices Section -->
        <section>
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-indigo-900">
                <i class="fa-solid fa-newspaper"></i> All Notices
            </h2>
            <div id="noticesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamically injected notice cards -->
            </div>
        </section>
    </main>

    <!-- Modal for Notice Creation -->
    <div id="noticeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-slate-800">Create New Notice</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="noticeForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Notice Title</label>
                    <input type="text" id="noticeTitle" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                        <select id="noticeCategory" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="Exam">Exam / Test</option>
                            <option value="Assignment">Assignment</option>
                            <option value="General">General Announcement</option>
                            <option value="Event">Department Event</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Priority</label>
                        <select id="noticePriority" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Expiry Date</label>
                        <input type="date" id="noticeExpiry" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Role-Based Publisher</label>
                        <select id="noticeRole" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="HOD / Professor">HOD / Professor</option>
                            <option value="Admin Staff">Admin Staff</option>
                            <option value="Class Representative">Class Representative</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Notice Content</label>
                    <textarea id="noticeContent" rows="4" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Attachment (Filename)</label>
                    <input type="text" id="noticeAttachment" placeholder="e.g. syllabus.pdf" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="noticePinned" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <label for="noticePinned" class="text-sm font-medium text-slate-700">Pin to top</label>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-100">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">Publish Notice</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto text-center text-sm text-slate-500">
        <p>&copy; 2026 Academic Department Notice Board System.</p>
    </footer>

    <!-- Application Script -->
    <script>
        let notices = [
            {
                id: 1,
                title: "Mid-Term Examination Schedule Released",
                category: "Exam",
                priority: "High",
                expiry: "2026-06-15",
                role: "HOD / Professor",
                content: "The mid-term examination schedule for all semesters has been published. Please check the attachment for details.",
                attachment: "midterm_schedule.pdf",
                pinned: true
            },
            {
                id: 2,
                title: "Database Assignment Submission Due",
                category: "Assignment",
                priority: "Medium",
                expiry: "2026-05-10",
                role: "Class Representative",
                content: "Submit your normalization assignment via the departmental portal before midnight.",
                attachment: "SQL_Assignment.pdf",
                pinned: false
            },
            {
                id: 3,
                title: "Department Annual Tech Fest 'InnoVibe'",
                category: "Event",
                priority: "Low",
                expiry: "2026-07-01",
                role: "Admin Staff",
                content: "Registrations are open for coding competitions, hackathons, and paper presentations.",
                attachment: "brochure.pdf",
                pinned: true
            }
        ];

        function renderNotices() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const catFilter = document.getElementById('categoryFilter').value;
            const prioFilter = document.getElementById('priorityFilter').value;

            const pinnedContainer = document.getElementById('pinnedContainer');
            const noticesContainer = document.getElementById('noticesContainer');

            pinnedContainer.innerHTML = '';
            noticesContainer.innerHTML = '';

            const filtered = notices.filter(n => {
                const matchesSearch = n.title.toLowerCase().includes(searchVal) || n.content.toLowerCase().includes(searchVal);
                const matchesCat = catFilter === 'All' || n.category === catFilter;
                const matchesPrio = prioFilter === 'All' || n.priority === prioFilter;
                return matchesSearch && matchesCat && matchesPrio;
            });

            if (filtered.length === 0) {
                noticesContainer.innerHTML = `<p class="col-span-full text-center text-slate-500 py-8">No matching notices found.</p>`;
                return;
            }

            filtered.forEach(notice => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-xl p-5 shadow-sm border ${notice.priority === 'High' ? 'border-red-300' : 'border-slate-200'} flex flex-col justify-between`;
                
                let badgeColor = 'bg-slate-100 text-slate-700';
                if(notice.priority === 'High') badgeColor = 'bg-red-100 text-red-700';
                if(notice.priority === 'Medium') badgeColor = 'bg-amber-100 text-amber-700';
                if(notice.priority === 'Low') badgeColor = 'bg-green-100 text-green-700';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded ${badgeColor}">${notice.priority}</span>
                            <span class="text-xs text-slate-400">Expiry: ${notice.expiry}</span>
                        </div>
                        <h3 class="font-bold text-lg text-slate-800 mb-2">${notice.title}</h3>
                        <p class="text-slate-600 text-sm mb-4">${notice.content}</p>
                    </div>
                    <div>
                        ${notice.attachment ? `<div class="mb-3 text-xs text-indigo-600 flex items-center gap-1"><i class="fa-solid fa-paperclip"></i> ${notice.attachment}</div>` : ''}
                        <div class="flex justify-between items-center pt-3 border-t border-slate-100 text-xs text-slate-500">
                            <span><i class="fa-solid fa-user-shield mr-1"></i> ${notice.role}</span>
                            <div class="flex gap-2">
                                <button onclick="togglePin(${notice.id})" class="text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-thumbtack ${notice.pinned ? 'text-amber-500' : ''}"></i></button>
                                <button onclick="deleteNotice(${notice.id})" class="text-slate-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;

                if (notice.pinned) {
                    pinnedContainer.appendChild(card.cloneNode(true));
                } else {
                    noticesContainer.appendChild(card);
                }
            });

            if (pinnedContainer.children.length === 0) {
                pinnedContainer.innerHTML = `<p class="col-span-full text-sm text-slate-400 italic">No pinned notices.</p>`;
            }
        }

        function openModal() {
            document.getElementById('noticeModal').classList.remove('hidden');
            document.getElementById('noticeModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('noticeModal').classList.remove('flex');
            document.getElementById('noticeModal').classList.add('hidden');
            document.getElementById('noticeForm').reset();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const newNotice = {
                id: Date.now(),
                title: document.getElementById('noticeTitle').value,
                category: document.getElementById('noticeCategory').value,
                priority: document.getElementById('noticePriority').value,
                expiry: document.getElementById('noticeExpiry').value,
                role: document.getElementById('noticeRole').value,
                content: document.getElementById('noticeContent').value,
                attachment: document.getElementById('noticeAttachment').value || null,
                pinned: document.getElementById('noticePinned').checked
            };
            notices.unshift(newNotice);
            renderNotices();
            closeModal();
        }

        function togglePin(id) {
            const notice = notices.find(n => n.id === id);
            if(notice) {
                notice.pinned = !notice.pinned;
                renderNotices();
            }
        }

        function deleteNotice(id) {
            notices = notices.filter(n => n.id !== id);
            renderNotices();
        }

        document.getElementById('searchInput').addEventListener('input', renderNotices);
        document.getElementById('categoryFilter').addEventListener('change', renderNotices);
        document.getElementById('priorityFilter').addEventListener('change', renderNotices);

        renderNotices();
    </script>
</body>
</html>
